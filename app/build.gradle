plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faceapp.beauty'
    compileSdk 34

    defaultConfig {
        applicationId "com.faceapp.beauty"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯 WebView, 无第三方依赖
}